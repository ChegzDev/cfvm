name: cfvm
description: CFVM (Chegz Flutter Version Management) - a lightweight CLI to install multiple Flutter SDK versions and switch between them per project.
version: 1.0.3
repository: https://github.com/ChegzDev/cfvm
issue_tracker: https://github.com/ChegzDev/cfvm/issues
topics:
  - flutter
  - version-manager
  - cli
  - sdk

environment:
  sdk: ^3.0.0

dependencies:
  args: ^2.4.0
  crypto: ^3.0.3
  path: ^1.8.3

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0

executables:
  cfvm:
